apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: github-scorecard-thresholds
  title: Example GitHub Service
  annotations:
    github.com/project-slug: janus-qe/overlay-scorecard-plugin-test
    backstage.io/source-location: url:https://github.com/janus-qe/overlay-scorecard-plugin-test
    # Uncomment to disable `github.openPRs` metric
    # scorecard.io/disabled-metrics: github.openPRs
    scorecard.io/github.openPRs.thresholds.rules.success: "<2"
    scorecard.io/github.openPRs.thresholds.rules.warning: "2-50"
spec:
  type: service
  owner: user:default/test1
  lifecycle: production
