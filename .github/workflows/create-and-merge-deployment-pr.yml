name: Create and Merge Deployment PR

on:
  workflow_dispatch:
    inputs:
      auto_merge_deployment_pr:
        description: "Automatically merge the final deployment PR"
        required: true
        default: true
        type: boolean
      deployment_status:
        description: "Expected deployment status after PR merge"
        required: true
        default: success
        type: choice
        options:
          - error
          - success
          - failure
          - inactive
          - in_progress
          - queued
          - pending
      merge_delay_minutes:
        description: "How many minutes to wait before auto-merge of the deployment PR (max 55 minutes)"
        required: false
        default: 0
        type: number
      intermediary_pr_count:
        description: "How many intermediary PRs to create and merge before deployment PR (max 20)"
        required: true
        default: 0
        type: number
      intermediary_pr_open_minutes:
        description: "How many minutes each intermediary PR should stay open before merge (PRs count * PR open minutes must be <= 40 minutes)"
        required: true
        default: 1
        type: number
  workflow_call:
    inputs:
      auto_merge_deployment_pr:
        description: "Automatically merge the final deployment PR"
        required: false
        default: true
        type: boolean
      deployment_status:
        description: "Expected deployment status after PR merge"
        required: false
        default: success
        type: string
      merge_delay_minutes:
        description: "How many minutes to wait before auto-merge of the deployment PR (max 55 minutes)"
        required: false
        default: 0
        type: number
      intermediary_pr_count:
        description: "How many intermediary PRs to create and merge before deployment PR (max 20)"
        required: false
        default: 0
        type: number
      intermediary_pr_open_minutes:
        description: "How many minutes each intermediary PR should stay open before merge (PRs count * PR open minutes must be <= 40 minutes)"
        required: false
        default: 1
        type: number
      run_label:
        description: "Distinguish when one caller invokes this workflow more than once"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: test-deployment/${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.run_label && format('-{0}', inputs.run_label) || '' }}
      FILE_NAME: deployment-simulations/latest.md
      # How long an intermediary PR sleeps between the commits it pushes while open.
      UPDATE_INTERVAL_SECONDS: 30
      # Pause after the last push before merging so GitHub finishes computing mergeability.
      MERGE_SETTLE_SECONDS: 3
    steps:
      - name: Validate inputs
        env:
          INTERMEDIARY_PR_COUNT: ${{ inputs.intermediary_pr_count }}
          INTERMEDIARY_PR_OPEN_MINUTES: ${{ inputs.intermediary_pr_open_minutes }}
          MERGE_DELAY_MINUTES: ${{ inputs.merge_delay_minutes }}
          DEPLOYMENT_STATUS: ${{ inputs.deployment_status }}
          MAX_INTERMEDIARY_MINUTES: 40
          MAX_FINAL_MERGE_MINUTES: 55
          MAX_PR_COUNT: 20
        run: |
          fail=0

          require_non_negative_integer() {
            local name="$1"
            local value="$2"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::$name must be a non-negative integer. Got: $value"
              fail=1
            fi
          }

          require_non_negative_integer intermediary_pr_count "$INTERMEDIARY_PR_COUNT"
          require_non_negative_integer intermediary_pr_open_minutes "$INTERMEDIARY_PR_OPEN_MINUTES"
          if [ -n "$MERGE_DELAY_MINUTES" ]; then
            require_non_negative_integer merge_delay_minutes "$MERGE_DELAY_MINUTES"
          fi

          # workflow_dispatch constrains this with a choice list, but workflow_call
          # can only type it as a string, so callers get checked here instead.
          case "$DEPLOYMENT_STATUS" in
            error|success|failure|inactive|in_progress|queued|pending) ;;
            *)
              echo "::error::deployment_status must be one of error, success, failure, inactive, in_progress, queued, pending. Got: $DEPLOYMENT_STATUS"
              fail=1
              ;;
          esac

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          if [ "$INTERMEDIARY_PR_COUNT" -gt "$MAX_PR_COUNT" ]; then
            echo "::error::pr_count is ${INTERMEDIARY_PR_COUNT}, which exceeds the maximum of ${MAX_PR_COUNT}."
            exit 1
          fi

          intermediary_total_minutes=$((INTERMEDIARY_PR_COUNT * INTERMEDIARY_PR_OPEN_MINUTES))
          if [ "$intermediary_total_minutes" -gt "$MAX_INTERMEDIARY_MINUTES" ]; then
            echo "::error::intermediary_pr_count * intermediary_pr_open_minutes is ${intermediary_total_minutes} minute(s), which exceeds the maximum of ${MAX_INTERMEDIARY_MINUTES} minutes."
            exit 1
          fi

          if [ -z "$MERGE_DELAY_MINUTES" ] || [ "$MERGE_DELAY_MINUTES" -eq 0 ]; then
            echo "Deployment PR auto-merge delay: none requested, will wait ${MERGE_SETTLE_SECONDS}s."
          elif [ "$MERGE_DELAY_MINUTES" -gt "$MAX_FINAL_MERGE_MINUTES" ]; then
            echo "::error::merge_delay_minutes is ${MERGE_DELAY_MINUTES}, which exceeds the maximum of ${MAX_FINAL_MERGE_MINUTES} minutes."
            exit 1
          else
            echo "Deployment PR auto-merge delay: ${MERGE_DELAY_MINUTES} minute(s)."
          fi

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create intermediary PRs and deployment PR
        id: prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          intermediary_pr_count="${{ inputs.intermediary_pr_count }}"
          intermediary_open_minutes="${{ inputs.intermediary_pr_open_minutes }}"
          action_run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          create_branch_commit_and_pr() {
            local suffix="$1"
            local title="$2"
            local body="$3"
            local branch_name="${BRANCH_NAME}-${suffix}"
            local pr_url

            git checkout main >/dev/null 2>&1
            git pull --ff-only origin main >/dev/null 2>&1
            git checkout -b "$branch_name" >/dev/null 2>&1

            mkdir -p "$(dirname "$FILE_NAME")"
            {
              echo "# Test PR for deployment testing"
              echo
              echo "- kind: $suffix"
              echo "- run_id: ${{ github.run_id }}"
              echo "- run_attempt: ${{ github.run_attempt }}"
              echo "- created_at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            } > "$FILE_NAME"

            git add "$FILE_NAME"
            git commit -m "chore: update test deployment marker ($suffix)" >/dev/null 2>&1
            git push origin "$branch_name" >/dev/null 2>&1

            pr_url="$(gh pr create \
              --base main \
              --head "$branch_name" \
              --title "$title" \
              --body "$body")"
            echo "$pr_url"
          }

          wait_and_merge_pr() {
            local pr_url="$1"
            local branch_name="$2"
            local open_minutes="$3"
            local open_seconds=$((open_minutes * 60))
            local update_interval_seconds="$UPDATE_INTERVAL_SECONDS"
            local update_count=$((open_seconds / update_interval_seconds))

            if [ "$open_seconds" -gt 0 ]; then
              echo "Waiting $open_minutes minute(s) before merging intermediary PR: $pr_url"
              for update_index in $(seq 1 "$update_count"); do
                echo "Update $update_index/$update_count for $branch_name. Creating commit before merge."
                sleep "$update_interval_seconds"

                git fetch origin "$branch_name" >/dev/null 2>&1
                git checkout "$branch_name" >/dev/null 2>&1 || git checkout -b "$branch_name" "origin/$branch_name" >/dev/null 2>&1
                git pull --ff-only origin "$branch_name" >/dev/null 2>&1

                {
                  echo
                  echo "- intermediary_update_number: $update_index"
                  echo "- intermediary_update_interval_seconds: $update_interval_seconds"
                  echo "- intermediary_update_at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                } >> "$FILE_NAME"

                git add "$FILE_NAME"
                git commit -m "chore: intermediary update ${update_index}/${update_count}" >/dev/null 2>&1
                git push origin "$branch_name" >/dev/null 2>&1
              done
            fi

            echo "Waiting ${MERGE_SETTLE_SECONDS}s for mergeability checks to settle before merge."
            sleep "$MERGE_SETTLE_SECONDS"
            gh pr merge "$pr_url" --squash --delete-branch
            echo "Merged intermediary PR: $pr_url"
          }

          if [ "$intermediary_pr_count" -gt 0 ]; then
            for i in $(seq 1 "$intermediary_pr_count"); do
              suffix="intermediary-${i}"
              pr_url="$(create_branch_commit_and_pr \
                "$suffix" \
                "chore: intermediary PR ${i} (${GITHUB_RUN_ID})" \
                "Intermediary PR ${i}/${intermediary_pr_count} created before deployment PR. Action run: ${action_run_url}")"
              echo "Created intermediary PR ${i}: $pr_url"
              wait_and_merge_pr "$pr_url" "${BRANCH_NAME}-${suffix}" "$intermediary_open_minutes"
            done
          fi

          deployment_pr_url="$(create_branch_commit_and_pr \
            "deployment" \
            "chore: test deployment PR (${GITHUB_RUN_ID})" \
            "Automatically created to test PR-triggered deployment events. Expected status: ${{ inputs.deployment_status }}. Action run: ${action_run_url}")"
          echo "deployment_pr_url=$deployment_pr_url" >> "$GITHUB_OUTPUT"
          echo "Created deployment PR: $deployment_pr_url"

      - name: Ensure labels exist and assign deployment status labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh label create deployment-test --color 1d76db --description "PR is eligible for test deployment event" 2>/dev/null || true
          for state in error failure inactive in_progress queued pending success; do
            gh label create "deployment-status-$state" --color 6f42c1 --description "Merged PR should create test deployment status: $state" 2>/dev/null || true
          done

          gh pr edit "${{ steps.prs.outputs.deployment_pr_url }}" --add-label deployment-test
          gh pr edit "${{ steps.prs.outputs.deployment_pr_url }}" --add-label "deployment-status-${{ inputs.deployment_status }}"
          echo "Added labels deployment-test,deployment-status-${{ inputs.deployment_status }} to: ${{ steps.prs.outputs.deployment_pr_url }}"

      - name: Wait until labels are visible on PR
        if: ${{ inputs.auto_merge_deployment_pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_url="${{ steps.prs.outputs.deployment_pr_url }}"
          required_labels="deployment-test deployment-status-${{ inputs.deployment_status }}"

          for attempt in 1 2 3 4 5; do
            labels="$(gh pr view "$pr_url" --json labels --jq '.labels[].name' | tr '\n' ' ')"
            echo "Attempt $attempt labels: $labels"

            missing=0
            for required in $required_labels; do
              if ! echo " $labels " | grep -q " $required "; then
                missing=1
              fi
            done

            if [ "$missing" -eq 0 ]; then
              echo "All required labels are visible on PR."
              exit 0
            fi

            sleep 2
          done

          echo "Required labels were not visible before merge. Deployment workflow will be skipped."
          exit 1

      - name: Wait before auto-merge
        if: ${{ inputs.auto_merge_deployment_pr }}
        env:
          MERGE_DELAY_MINUTES: ${{ inputs.merge_delay_minutes }}
        run: |
          if [ -z "$MERGE_DELAY_MINUTES" ] || [ "$MERGE_DELAY_MINUTES" -eq 0 ]; then
            echo "No merge delay requested. Waiting ${MERGE_SETTLE_SECONDS}s before auto-merge..."
            sleep "$MERGE_SETTLE_SECONDS"
            exit 0
          fi

          delay_seconds=$((MERGE_DELAY_MINUTES * 60))
          echo "Waiting ${MERGE_DELAY_MINUTES} minute(s) before auto-merge..."
          sleep "$delay_seconds"

      - name: Refresh GitHub App installation token
        id: merge-token
        if: ${{ inputs.auto_merge_deployment_pr }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Auto-merge pull request
        if: ${{ inputs.auto_merge_deployment_pr }}
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.prs.outputs.deployment_pr_url }}" --squash --delete-branch
          echo "Requested merge for: ${{ steps.prs.outputs.deployment_pr_url }}"
